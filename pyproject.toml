[project]
name = "kensetsu-trouble-agent"
version = "0.1.0"
description = "建設業界トラブル対応AIエージェント（Claude Skills + トラブルログCLI、業種パックで製造業・運送業に横展開）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
troublelog = "troublelog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["troublelog"]

[tool.setuptools.package-data]
troublelog = ["industries/*.json"]
